dns:
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - '+.lan'
  - '+.local'
  - '+.arpa'
  - localhost
  - localhost.localdomain
  - 'time.*.com'
  - 'ntp.*.com'
  - '+.pool.ntp.org'
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fallback:
  - https://1.1.1.1/dns-query#RULES
  - https://8.8.8.8/dns-query#RULES
  fallback-filter:
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    - 127.0.0.1/32
    - 100.64.0.0/10
  ipv6: false
  listen: :53
  nameserver:
  - https://1.1.1.1/dns-query#RULES
  - https://8.8.8.8/dns-query#RULES
  nameserver-policy:
    geosite:gfw:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
  prefer-h3: false
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
